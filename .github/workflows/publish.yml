# Triggered when a GitHub Release is published, or dispatched by release.yml.
#
# The publish jobs run inside the `marketplace` environment. Its only protection rule is a
# deployment branch policy admitting the single TAG pattern `v0.*` — there are NO required
# reviewers, so reaching these jobs means shipping, with nothing to approve. Two consequences
# worth knowing before you edit this file:
#   - This workflow must be reached on a tag ref. A run on a branch ref is rejected before any
#     step executes (~2s, no runner), which looks like a build failure and is not one.
#   - Nothing else stands between a merge to main and a live release.

name: Publish the VS Code Extension

on:
  release:
    types: [published]
  # Manual escape hatch. A release created by release.yml uses GITHUB_TOKEN, and GitHub
  # deliberately does NOT start workflow runs from events raised by that token (its
  # anti-recursion rule) — so `release: published` never fires for an automated release and the
  # publish silently never happens. That stranded v0.1.4: tagged, released, and absent from both
  # marketplaces with nothing queued and no failure anywhere to notice.
  # release.yml now calls this workflow directly, and this input lets a human re-run a publish
  # for any tag without deleting and recreating the release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.5)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-vsce:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Pin the packaged commit to the tag input rather than trusting the dispatched ref:
          # a hand-run from the Actions UI can select any ref, and packaging something other
          # than the tag being published is silent and hard to spot. On `release: published`
          # this is empty and checkout keeps its default.
          ref: ${{ inputs.tag || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Supply-chain gate: known-compromised versions, IOC filenames/strings/hashes, and install
      # hooks outside the allowlist. CRITICAL findings exit non-zero even without --strict.
      #
      # This also runs in ci.yml, and that is NOT enough. ci.yml and release.yml trigger on the
      # same push to main and run concurrently, so the publish is dispatched and can finish
      # before CI has said anything — CI cannot gate it. Every other CI step is already covered
      # here, because `vsce publish`/`vsce package` run `vscode:prepublish` (the full
      # `pnpm run package` gate: cleanroom, diagram, model registry, types, lint, the unit
      # suite, production bundles). This scan was the sole exception, which meant a compromised
      # dependency could be installed and bundled into the .vsix unscanned. Keep it here so the
      # publish stands on its own and the CI race stays irrelevant.
      #
      # Drift is advisory without --strict, and unreachable upstream sources only fail under
      # --strict, so a flaky registry cannot block a release. Only a CRITICAL finding does.
      - run: node scripts/check-currency.mjs
      # check:cleanroom scans with ripgrep and HARD-FAILS when it is absent — a missing rg
      # used to exit 127 and fall through to a silent PASS, so the wall reported OK on a
      # machine that could not actually scan. The runner image does not ship ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm run pretest
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: pnpm exec vsce publish --no-dependencies --no-yarn --skip-duplicate --azure-credential

  publish-ovsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Pin the packaged commit to the tag input rather than trusting the dispatched ref:
          # a hand-run from the Actions UI can select any ref, and packaging something other
          # than the tag being published is silent and hard to spot. On `release: published`
          # this is empty and checkout keeps its default.
          ref: ${{ inputs.tag || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Supply-chain gate: known-compromised versions, IOC filenames/strings/hashes, and install
      # hooks outside the allowlist. CRITICAL findings exit non-zero even without --strict.
      #
      # This also runs in ci.yml, and that is NOT enough. ci.yml and release.yml trigger on the
      # same push to main and run concurrently, so the publish is dispatched and can finish
      # before CI has said anything — CI cannot gate it. Every other CI step is already covered
      # here, because `vsce publish`/`vsce package` run `vscode:prepublish` (the full
      # `pnpm run package` gate: cleanroom, diagram, model registry, types, lint, the unit
      # suite, production bundles). This scan was the sole exception, which meant a compromised
      # dependency could be installed and bundled into the .vsix unscanned. Keep it here so the
      # publish stands on its own and the CI race stays irrelevant.
      #
      # Drift is advisory without --strict, and unreachable upstream sources only fail under
      # --strict, so a flaky registry cannot block a release. Only a CRITICAL finding does.
      - run: node scripts/check-currency.mjs
      # `vsce package` runs the `vscode:prepublish` script, i.e. the full `pnpm run package`
      # gate — which includes check:cleanroom, and that hard-fails without ripgrep. The runner
      # image does not ship it. This job needs it for exactly the same reason the marketplace
      # job does; omitting it here is what failed the v0.1.1 Open VSX publish.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm exec vsce package --no-dependencies -o pi-code-gui.vsix
      # The token goes through the ENVIRONMENT, not argv: process arguments are world-readable
      # via /proc/<pid>/cmdline on the runner, and appear in error output. ovsx reads OVSX_PAT.
      # `create-namespace` legitimately fails once the namespace exists, so tolerate ONLY that —
      # the previous `|| true` also swallowed genuine auth failures.
      - name: Ensure Open VSX namespace
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_MARKETPLACE_TOKEN }}
        run: |
          out=$(pnpm exec ovsx create-namespace NimbleTron 2>&1) || {
            echo "$out"
            echo "$out" | grep -qiE "already (exists|owned)" || exit 1
          }
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_MARKETPLACE_TOKEN }}
        run: pnpm exec ovsx publish pi-code-gui.vsix
