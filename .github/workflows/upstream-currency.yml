name: Upstream currency

# Watch the projects this extension targets and, when one releases, open a PULL REQUEST that does
# the bump — the way Dependabot does for ordinary dependencies. See
# agent-wiki/operations/upstream-bump-prs.md.
#
# WHY THIS EXISTS: scripts/check-currency.mjs had been correctly reporting a stale upstream pin for
# months — into build logs nobody read. Moving that into an issue fixed "nobody was told", but an
# issue still waits for someone to run the bump by hand. Both bumps are now done here, and the
# part that needs a human (reading the price changes; reading the live-check result) is the PR
# review.
#
# WHY NOT DEPENDABOT: it reads manifests, and not everything we need watched is one.
#   - @earendil-works/pi-coding-agent is installed GLOBALLY and is deliberately not a dependency
#     of this package. What we record is `testedAgainst` in src/pi-sdk-version.json, and moving
#     it means actually running the extension on that release (scripts/live-sdk-check.mjs).
#   - @earendil-works/pi-ai IS a devDependency, but .github/dependabot.yml ignores it BY NAME: a
#     bare bump leaves src/model-registry.generated.json behind and fails the build. Here the
#     bump, the regeneration and the price table land in one PR.
#
# TRUST SPLIT. The prepare jobs run upstream code (pnpm add, the catalog generator, the live
# check) and get a READ-ONLY token and no secrets: the live check drives a scripted model, not a
# vendor's. They hand a patch to `open-prs`, which can push but never installs or runs upstream
# code: it checks the patch touches only the files its target owns, then uses git and gh
# (scripts/upstream-pr.mjs).
#
# WHO PUSHES: an org-owned GitHub App, not the workflow's GITHUB_TOKEN. Three rules meet here:
# main requires SIGNED commits (GitHub signs a bot's commit made through its API, but only when the
# request names no custom author); the org ruleset `nimbletron-author-email` requires an
# @nimbletron.ai author on EVERY branch (so the bot's own author needs a bypass); and a ruleset's
# bypass list accepts GitHub Apps but not the built-in GitHub Actions bot. An App's pushes and PRs
# also trigger workflows, so CI runs on the bot's PRs like on anyone else's.
#
# ONE-TIME SETUP (agent-wiki/operations/upstream-bump-prs.md has the click-by-click):
#   - A GitHub App owned by the org, installed on this repo only, with Contents and Pull requests
#     read/write. Its App ID in the repo VARIABLE UPSTREAM_BOT_APP_ID, its private key in the repo
#     SECRET UPSTREAM_BOT_PRIVATE_KEY. Without them no PR is attempted and the issue says why.
#   - That App on the bypass list of the org ruleset `nimbletron-author-email`, "Always allow".

on:
  schedule:
    # Mondays, 07:00 UTC — ahead of the Dependabot runs configured for the same day, so a week's
    # upstream news lands together rather than trickling in.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

# A scheduled run and a manual one must not both push the same branch or edit the same issue.
concurrency:
  group: upstream-currency
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pi_ai: ${{ steps.pick.outputs.pi_ai }}
      sdk: ${{ steps.pick.outputs.sdk }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      # check-currency.mjs also runs the supply-chain scan over installed packages, so the
      # dependencies have to be present. A CRITICAL finding is worth an issue on the same footing
      # as a stale pin.
      - run: pnpm install --frozen-lockfile

      # `|| true`: a non-zero exit means drift or a finding, which is what this workflow reports.
      # A genuinely broken check produces no JSON and fails the next step.
      - name: Check upstream currency
        run: node scripts/check-currency.mjs --json > currency.json || true

      # The version to move each target to, or empty when it is current or unreachable.
      - name: Pick what to bump
        id: pick
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("currency.json", "utf8"));
            const v = (id) => (r.items.find((i) => i.id === id && i.state === "stale") || {}).latest || "";
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `pi_ai=${v("pi-ai")}\nsdk=${v("pi-coding-agent")}\n`);
          '

      # Kept 90 days: when a pin finally moves it is useful to see when upstream shipped it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: currency-report
          path: currency.json
          retention-days: 90

  prepare-pi-ai:
    needs: check
    if: needs.check.outputs.pi_ai != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      V: ${{ needs.check.outputs.pi_ai }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Bump pi-ai and regenerate the catalog
        run: |
          cp src/model-registry.generated.json "$RUNNER_TEMP/old-registry.json"
          pnpm add -D "@earendil-works/pi-ai@$V"
          pnpm run gen:model-registry

      # Every check runs even after one fails, so the PR shows the whole picture. A failing build
      # still gets a PR, as a draft, because the fix belongs on that branch. A CRITICAL
      # supply-chain finding gets NO PR: nothing should invite merging a compromised tree.
      - name: Verify the bumped tree
        run: |
          mkdir -p prepared
          { echo "| check | result |"; echo "| --- | --- |"; } > prepared/checks.md
          failed=""
          supply_ok=1
          for c in "Supply-chain scan|node scripts/check-currency.mjs" \
                   "Type-check|pnpm run check-types" \
                   "Lint|pnpm run lint" \
                   "Unit tests|pnpm run test:unit" \
                   "Catalog consistency|node scripts/check-model-registry.mjs" \
                   "Production build|node esbuild.js --production && node esbuild.webview.js --production"; do
            name="${c%%|*}"; cmd="${c#*|}"
            echo "::group::$name"
            if bash -c "$cmd"; then r="pass"; else r="**FAIL**"; failed="${failed:+$failed, }$name"
              [ "$name" = "Supply-chain scan" ] && supply_ok=0
            fi
            echo "::endgroup::"
            echo "| $name | $r |" >> prepared/checks.md
          done
          echo "" >> prepared/checks.md
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> prepared/checks.md

          node scripts/registry-diff.mjs "$RUNNER_TEMP/old-registry.json" src/model-registry.generated.json > prepared/report.md
          if [ "$supply_ok" = 1 ]; then
            git diff --binary -- package.json pnpm-lock.yaml src/model-registry.generated.json > prepared/change.patch
          fi
          FAILED="$failed" SUPPLY_OK="$supply_ok" node -e '
            const f = process.env.FAILED;
            const s = process.env.SUPPLY_OK === "1"
              ? { ready: !f, reason: f ? `these checks failed on the bumped tree: ${f}` : null }
              : { ready: false, reason: "the supply-chain scan found a CRITICAL problem in the bumped install" };
            require("fs").writeFileSync("prepared/status.json", JSON.stringify(s));
          '
          cat prepared/status.json

      - uses: actions/upload-artifact@v7
        with:
          name: prepared-pi-ai
          path: prepared/
          retention-days: 14

  prepare-sdk:
    needs: check
    if: needs.check.outputs.sdk != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      V: ${{ needs.check.outputs.sdk }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Installed the way users install it. The extension finds it through PATH, as it would on a
      # user's machine.
      - run: npm install -g "@earendil-works/pi-coding-agent@$V"
      - run: pnpm run compile-tests

      # No API key: the check runs the SDK against pi-ai's scripted (faux) provider.
      - name: Live check on the released SDK
        id: live
        run: |
          mkdir -p prepared
          set +e
          node --import ./scripts/vscode-register.mjs scripts/live-sdk-check.mjs --report prepared/report.md --json prepared/live.json
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # testedAgainst moves ONLY on a passing run. Otherwise there is no patch, hence no PR, and
      # the issue carries the report instead.
      - name: Record the result
        env:
          CODE: ${{ steps.live.outputs.code }}
        run: |
          summary=$(node -e 'const j=require("./prepared/live.json"); console.log(`${j.passed}/${j.passed + j.failed} checks`)')
          if [ "$CODE" = "0" ]; then
            node scripts/upstream-pr.mjs set-sdk-version "$V" --summary "$summary"
            git diff --binary -- src/pi-sdk-version.json > prepared/change.patch
            echo '{"ready":true}' > prepared/status.json
          else
            node -e '
              const j = require("./prepared/live.json");
              const reason = process.env.CODE === "2"
                ? `the live check could not run: ${j.note}`
                : `the live check failed (${process.argv[1]}), so testedAgainst stays where it is`;
              require("fs").writeFileSync("prepared/status.json", JSON.stringify({ ready: false, reason }));
            ' "$summary"
          fi
          cat prepared/status.json

      - uses: actions/upload-artifact@v7
        with:
          name: prepared-pi-coding-agent
          path: prepared/
          retention-days: 14

  open-prs:
    needs: [check, prepare-pi-ai, prepare-sdk]
    if: always() && needs.check.result == 'success' && (needs.check.outputs.pi_ai != '' || needs.check.outputs.sdk != '')
    runs-on: ubuntu-latest
    # Every write goes through the App's token below, except the approval: a PR's author (the App)
    # cannot approve its own PR, and main needs one, so this job's token gives it.
    permissions:
      contents: read
      pull-requests: write
    env:
      # The App ID is not secret, so a repo VARIABLE is where it belongs, but a secret of the same
      # name is accepted too (an easy slip in the settings UI). Secrets can't appear in a step's
      # `if:`, hence these job-level copies.
      BOT_APP_ID: ${{ vars.UPSTREAM_BOT_APP_ID || secrets.UPSTREAM_BOT_APP_ID }}
      BOT_KEY_SET: ${{ secrets.UPSTREAM_BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the read-only GITHUB_TOKEN stays for git fetch; nothing is pushed with it
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          pattern: prepared-*
          path: prepared
        continue-on-error: true   # none at all when both prepare jobs failed

      # A token for the org's bot App, limited to this repo and to what opening a PR needs.
      - name: Get the bot App's token
        id: app
        if: env.BOT_APP_ID != '' && env.BOT_KEY_SET == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.BOT_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APPROVER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_BOT_SLUG: ${{ steps.app.outputs.app-slug }}
          PI_AI: ${{ needs.check.outputs.pi_ai }}
          SDK: ${{ needs.check.outputs.sdk }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          : > prs.jsonl
          skip() {
            T="$1" VER="$2" WHY="$3" node -e 'require("fs").appendFileSync("prs.jsonl", JSON.stringify({ target: process.env.T, version: process.env.VER, state: "skipped", reason: process.env.WHY }) + "\n")'
          }
          for pair in "pi-ai|$PI_AI" "pi-coding-agent|$SDK"; do
            t="${pair%%|*}"; v="${pair#*|}"
            [ -n "$v" ] || continue
            if [ -z "$GH_TOKEN" ]; then
              missing=""
              [ -n "$BOT_APP_ID" ] || missing="the repo variable UPSTREAM_BOT_APP_ID"
              [ "$BOT_KEY_SET" = "true" ] || missing="${missing:+$missing and }the repo secret UPSTREAM_BOT_PRIVATE_KEY"
              skip "$t" "$v" "the bot App is not set up: this run could not see ${missing:-its token} (Settings → Secrets and variables → Actions; see agent-wiki/operations/upstream-bump-prs.md)"
            elif [ -d "prepared/prepared-$t" ]; then
              # pi-ai's release note says which Pi SDK it was tested against: this run's, if its
              # live check passed, else main's testedAgainst.
              extra=()
              [ "$t" = pi-ai ] && extra=(--sdk-version "$SDK" --sdk-dir prepared/prepared-pi-coding-agent)
              node scripts/upstream-pr.mjs open --target "$t" --version "$v" --dir "prepared/prepared-$t" --out prs.jsonl "${extra[@]}" || true
            else
              skip "$t" "$v" "its prepare job failed ($RUN_URL)"
            fi
          done
          cat prs.jsonl

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prs
          path: prs.jsonl
          retention-days: 14

  report:
    needs: [check, open-prs]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          name: currency-report
      - uses: actions/download-artifact@v5
        if: needs.open-prs.result != 'skipped'
        with:
          name: prs
        continue-on-error: true

      # The issue is the fallback now: it stays open only for a stale target with no PR, or a
      # CRITICAL supply-chain finding — and in exactly those cases this step, and so the run,
      # FAILS after writing the issue. See the header of scripts/report-currency-issue.mjs.
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f prs.jsonl ]; then
            node scripts/report-currency-issue.mjs currency.json --prs prs.jsonl
          else
            node scripts/report-currency-issue.mjs currency.json
          fi
