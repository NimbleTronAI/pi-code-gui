name: Tag and release on version bump

# When the version in package.json changes on the default branch (e.g. you merge
# a dependency PR that the bump workflow versioned), create the matching git tag
# and a GitHub Release with auto-generated notes.
#
# Publishing to the VS Code Marketplace / Open VSX is NOT done here — publish.yml
# does that, and the step below dispatches it.
#
# Be clear about what gates that publish: the `marketplace` environment's ONLY
# protection rule is a deployment branch policy admitting the single TAG pattern
# `v0.*`. There are no required reviewers and no wait timer, so nothing pauses
# for human approval — a successful run of this workflow SHIPS. Earlier comments
# here claimed an approval gate that does not exist; if you want one, add
# required reviewers to the environment, don't rely on this text.
on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write
  # `gh workflow run` dispatches publish.yml — see the step below.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect version change
        id: ver
        run: |
          set -euo pipefail
          new=$(node -p "require('./package.json').version")
          old=$(git show HEAD~1:package.json 2>/dev/null \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version)}catch{process.stdout.write('')}})" \
                || echo "")
          echo "version=$new" >> "$GITHUB_OUTPUT"
          # The release condition is the absence of the TAG, not a difference from HEAD~1.
          #
          # It used to require both, and that made every refusal below permanent. v0.2.4 was
          # bumped on main, the stale-catalog gate correctly refused to tag it, and the fix
          # landed one commit later — by which point HEAD~1 already carried 0.2.4, so
          # `new != old` was false and the tag was never re-attempted. The version sat on main,
          # untagged, unreleased, and unreachable by any future push: a gate that consumed the
          # version it declined to ship.
          #
          # Keying on the tag alone makes a refusal RETRYABLE. Any later push touching
          # package.json re-attempts an untagged version, so fixing what the gate objected to
          # is all it takes. The HEAD~1 comparison is kept for the log line, where being
          # approximate is harmless.
          if [ -n "$new" ] && ! git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            if [ "$new" = "$old" ]; then
              echo "Releasing v$new — unchanged since HEAD~1 but never tagged (a retry)."
            else
              echo "Releasing v$new (was: ${old:-none})."
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release: v$new is already tagged (old=${old:-none})."
          fi

      # Refuse to TAG a stale catalog, rather than discovering it at publish.
      #
      # v0.2.2 was tagged and released, then both publish jobs refused it because the bundled
      # catalog was three pi-ai releases behind — the gate working, but too late: the tag was cut,
      # so the version was stranded and could only be recovered by cutting another one. CI cannot
      # cover this, because ci.yml and this workflow trigger on the same push and run
      # concurrently. Checking here is the only point that precedes the tag.
      #
      # A refusal here is retryable BY DESIGN — see the tag-keyed condition above. Refresh the
      # catalog, merge, and the next push touching package.json re-attempts the same version.
      # That property is what makes gating before the tag safe; without it a refusal would
      # strand the version just as surely as the late gate did, only earlier and more quietly.
      - name: Refuse to release a stale model catalog
        if: ${{ steps.ver.outputs.release == 'true' }}
        env:
          PI_REGISTRY_CURRENCY_STRICT: "1"
        # No install needed: the generated catalog carries the pi-ai version it was built from,
        # which is what a release would ship.
        run: node scripts/check-model-registry.mjs

      - name: Create tag and GitHub Release
        if: ${{ steps.ver.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: v${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "$V"
          git push origin "$V"
          gh release create "$V" --title "$V" --generate-notes
          # Start the publish EXPLICITLY. The `release: published` event above is raised by
          # GITHUB_TOKEN, and GitHub does not start workflow runs from that token — so
          # publish.yml would never fire on its own. v0.1.4 was tagged and released and simply
          # never published, with nothing queued and no failure to notice. Dispatching by hand
          # closes the chain without introducing a PAT.
          #
          # Dispatch on the TAG, not on main. The `marketplace` environment admits only tag
          # refs matching `v0.*`, so a run dispatched with `--ref main` is rejected outright:
          # both jobs fail in ~2s with no runner and no steps, which reads as a build failure
          # and is not one. That is exactly how v0.1.6 failed. The tag also pins the workflow
          # definition to the released commit, so a publish reflects what was tagged.
          gh workflow run publish.yml --ref "$V" -f tag="$V"
