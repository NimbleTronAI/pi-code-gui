<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fab387"/>
      <stop offset="100%" stop-color="#eba0ac"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cba6f7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f9e2af"/>
    </marker>
    <marker id="arrowRust" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fab387"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="480" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" fill="#cdd6f4" font-family="DejaVu Sans" font-size="14" font-weight="600">Pi Code Gui — Dual-Runtime Architecture</text>

  <!-- ====== Extension Process ====== -->
  <rect x="12" y="46" width="736" height="196" rx="8" fill="none" stroke="#45475a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="26" y="66" fill="#6c7086" font-family="DejaVu Sans" font-size="10">VS Code Extension Process</text>

  <!-- PiService -->
  <rect x="34" y="80" width="256" height="74" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="162" y="101" text-anchor="middle" fill="#cba6f7" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">PiService</text>
  <text x="162" y="119" text-anchor="middle" fill="#f9e2af" font-family="DejaVu Sans Mono" font-size="9">_backendKind: typescript | rust</text>
  <text x="162" y="135" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">events · UI bridge · pickers</text>
  <text x="162" y="149" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">status · slash commands</text>

  <!-- PiWebviewPanel -->
  <rect x="470" y="80" width="256" height="74" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="598" y="101" text-anchor="middle" fill="#89b4fa" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">PiWebviewPanel</text>
  <text x="598" y="119" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">Chat UI · streaming text</text>
  <text x="598" y="135" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">thinking blocks · tool output</text>
  <text x="598" y="149" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">markdown / custom cards</text>

  <!-- PiService <-> Webview -->
  <line x1="290" y1="104" x2="470" y2="104" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="380" y="99" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="8">events (text_delta, tool_execution…)</text>
  <line x1="470" y1="130" x2="290" y2="130" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="380" y="144" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="8">prompt · steer · abort</text>

  <!-- Bridge Tools (TS only) -->
  <rect x="34" y="172" width="150" height="58" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="109" y="194" text-anchor="middle" fill="#a6e3a1" font-family="DejaVu Sans Mono" font-size="10" font-weight="700">Bridge Tools (16)</text>
  <text x="109" y="212" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="8">vscode_* APIs · TS only</text>

  <!-- PiService -> Bridge Tools -->
  <line x1="109" y1="154" x2="109" y2="172" stroke="url(#accent)" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- ====== Runtime engines ====== -->
  <!-- TypeScript Pi (in-process) -->
  <rect x="34" y="266" width="300" height="106" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="52" y="292" fill="#f9e2af" font-family="DejaVu Sans Mono" font-size="12" font-weight="700">TypeScript Pi</text>
  <rect x="232" y="281" width="84" height="16" rx="8" fill="#45475a"/>
  <text x="274" y="293" text-anchor="middle" fill="#cdd6f4" font-family="DejaVu Sans Mono" font-size="8">in-process</text>
  <text x="52" y="316" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">@earendil-works/pi-coding-agent</text>
  <text x="52" y="334" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">SDK loaded in the extension host</text>
  <text x="52" y="352" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">createAgentSession() · 16 bridge tools</text>

  <!-- PiService -> TypeScript Pi -->
  <line x1="250" y1="154" x2="250" y2="266" stroke="#f9e2af" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <text x="258" y="250" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="8">in-process</text>
  <!-- Bridge Tools -> TypeScript Pi -->
  <line x1="109" y1="230" x2="109" y2="266" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="113" y="252" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="8">customTools</text>

  <!-- Spawned process (Rust, out-of-process) -->
  <rect x="392" y="250" width="336" height="152" rx="8" fill="none" stroke="#fab387" stroke-width="1.3" stroke-dasharray="6,3"/>
  <text x="406" y="270" fill="#6c7086" font-family="DejaVu Sans" font-size="10">Spawned process · out-of-process</text>
  <rect x="410" y="282" width="300" height="104" rx="6" fill="#313244" stroke="url(#rust)" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="428" y="308" fill="#fab387" font-family="DejaVu Sans Mono" font-size="12" font-weight="700">Rust Pi</text>
  <rect x="520" y="297" width="86" height="16" rx="8" fill="#45475a"/>
  <text x="563" y="309" text-anchor="middle" fill="#cdd6f4" font-family="DejaVu Sans Mono" font-size="8">rpc · stdio</text>
  <text x="428" y="332" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">pi_agent_rust  (pi --mode rpc)</text>
  <text x="428" y="350" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">built-in read/write/edit/bash/grep</text>
  <text x="428" y="368" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">QuickJS extensions · native providers</text>

  <!-- PiService -> Rust (spawn + JSON-RPC) -->
  <line x1="290" y1="138" x2="412" y2="312" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrowRust)"/>
  <text x="356" y="256" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="8">spawn · JSON-RPC / stdio</text>

  <!-- ====== Bottom: host APIs and LLM ====== -->
  <rect x="34" y="420" width="300" height="28" rx="5" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="184" y="438" text-anchor="middle" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="9">vscode.* API · editor · diagnostics · symbols</text>
  <rect x="410" y="420" width="300" height="28" rx="5" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="560" y="438" text-anchor="middle" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="9">LLM providers (HTTPS · streaming)</text>

  <!-- TS -> vscode API -->
  <line x1="150" y1="372" x2="150" y2="420" stroke="#f9e2af" stroke-width="1.8" marker-end="url(#arrowYellow)"/>
  <!-- TS -> LLM (dashed) -->
  <line x1="300" y1="372" x2="430" y2="420" stroke="#6c7086" stroke-width="1.3" stroke-dasharray="4,3"/>
  <!-- Rust -> LLM -->
  <line x1="560" y1="386" x2="560" y2="420" stroke="#fab387" stroke-width="1.8" marker-end="url(#arrowRust)"/>
  <!-- Rust -> files note -->
  <text x="560" y="466" text-anchor="middle" fill="#585b70" font-family="DejaVu Sans Mono" font-size="8">Rust uses its own file/shell tools — no VS Code bridge</text>
</svg>
