<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="380" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" fill="#cdd6f4" font-family="DejaVu Sans" font-size="13" font-weight="600">Pi on Code — Architecture</text>

  <!-- ====== Extension Process ====== -->
  <rect x="12" y="46" width="696" height="322" rx="8" fill="none" stroke="#45475a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="24" y="66" fill="#6c7086" font-family="DejaVu Sans" font-size="10">VS Code Extension Process</text>

  <!-- Pi Service -->
  <rect x="30" y="80" width="240" height="68" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="100" text-anchor="middle" fill="#cba6f7" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">PiService</text>
  <text x="150" y="116" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">createAgentSession()</text>
  <text x="150" y="132" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">session.subscribe(events)</text>

  <!-- Webview Panel -->
  <rect x="450" y="80" width="240" height="68" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="100" text-anchor="middle" fill="#89b4fa" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">PiWebviewPanel</text>
  <text x="570" y="116" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">Chat UI · streaming text</text>
  <text x="570" y="132" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">thinking blocks · tool output</text>

  <!-- Bridge Tools -->
  <rect x="30" y="260" width="240" height="52" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="280" text-anchor="middle" fill="#a6e3a1" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">Bridge Tools (17)</text>
  <text x="150" y="298" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">vscode_get_editor_state · vscode_get_diagnostics · …</text>

  <!-- pi SDK -->
  <rect x="450" y="260" width="240" height="52" rx="6" fill="#313244" stroke="#fab387" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="280" text-anchor="middle" fill="#fab387" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">pi SDK (in-process)</text>
  <text x="570" y="298" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">@earendil-works/pi-coding-agent</text>

  <!-- VS Code API -->
  <rect x="30" y="338" width="660" height="26" rx="5" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="360" y="355" text-anchor="middle" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="10">vscode.* API (editor, diagnostics, symbols, workspace, commands)</text>

  <!-- Arrows: PiService → WebviewPanel -->
  <line x1="270" y1="114" x2="450" y2="114" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cba6f7"/>
    </marker>
  </defs>
  <text x="360" y="109" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="8">events (agent_start, text_delta, tool_execution, …)</text>

  <!-- Arrow: WebviewPanel → PiService (prompt) -->
  <line x1="450" y1="148" x2="270" y2="148" stroke="url(#green)" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a6e3a1"/>
    </marker>
  </defs>
  <text x="360" y="162" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="8">session.prompt() · session.steer() · session.abort()</text>

  <!-- Arrow: PiService → pi SDK -->
  <line x1="150" y1="148" x2="150" y2="260" stroke="url(#yellow)" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <defs>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fab387"/>
    </marker>
  </defs>

  <!-- Arrow: pi SDK → LLM -->
  <line x1="240" y1="285" x2="450" y2="285" stroke="#fab387" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="345" y="280" text-anchor="middle" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="8">HTTP stream (SSE/WS)</text>

  <!-- Arrow: Bridge tools → VS Code API -->
  <line x1="150" y1="312" x2="150" y2="338" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Arrow: pi SDK → VS Code API -->
  <line x1="570" y1="312" x2="570" y2="338" stroke="#fab387" stroke-width="1.5"/>

  
</svg>
