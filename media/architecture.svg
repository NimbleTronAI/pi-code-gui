<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cba6f7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f9e2af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="480" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" fill="#cdd6f4" font-family="DejaVu Sans" font-size="14" font-weight="600">Pi Code Gui — Architecture</text>

  <!-- ====== Extension host ====== -->
  <rect x="12" y="46" width="736" height="330" rx="8" fill="none" stroke="#45475a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="26" y="66" fill="#6c7086" font-family="DejaVu Sans" font-size="10">VS Code extension host (one process)</text>

  <!-- PiService -->
  <rect x="34" y="80" width="256" height="74" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="162" y="101" text-anchor="middle" fill="#cba6f7" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">PiService</text>
  <text x="162" y="119" text-anchor="middle" fill="#f9e2af" font-family="DejaVu Sans Mono" font-size="9">orchestrator · one session per tab</text>
  <text x="162" y="135" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">events · UI bridge · pickers</text>
  <text x="162" y="149" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">status · slash commands</text>

  <!-- PiWebviewPanel -->
  <rect x="470" y="80" width="256" height="74" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="598" y="101" text-anchor="middle" fill="#89b4fa" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">PiWebviewPanel</text>
  <text x="598" y="119" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">Chat UI · streaming text</text>
  <text x="598" y="135" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">thinking blocks · tool output</text>
  <text x="598" y="149" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">markdown / custom cards</text>

  <!-- PiService <-> Webview -->
  <line x1="290" y1="104" x2="470" y2="104" stroke="#cba6f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="380" y="99" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="8">events (text, tool calls…)</text>
  <line x1="470" y1="130" x2="290" y2="130" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="380" y="144" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="8">prompt · steer · abort</text>

  <!-- SdkService -->
  <rect x="34" y="184" width="256" height="56" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="162" y="205" text-anchor="middle" fill="#f9e2af" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">SdkService</text>
  <text x="162" y="223" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">PiBackend: load SDK · session · model</text>

  <!-- PiService -> SdkService -->
  <line x1="162" y1="154" x2="162" y2="184" stroke="#f9e2af" stroke-width="2" marker-end="url(#arrowYellow)"/>

  <!-- Bridge Tools -->
  <rect x="470" y="184" width="256" height="56" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="598" y="205" text-anchor="middle" fill="#a6e3a1" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">Bridge Tools (16)</text>
  <text x="598" y="223" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">vscode_* tools for the agent</text>

  <!-- ====== Pi SDK (in-process) ====== -->
  <rect x="34" y="276" width="300" height="84" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="52" y="298" fill="#f9e2af" font-family="DejaVu Sans Mono" font-size="12" font-weight="700">Pi SDK</text>
  <rect x="232" y="286" width="84" height="16" rx="8" fill="#45475a"/>
  <text x="274" y="298" text-anchor="middle" fill="#cdd6f4" font-family="DejaVu Sans Mono" font-size="8">in-process</text>
  <text x="52" y="321" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">@earendil-works/pi-coding-agent</text>
  <text x="52" y="337" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">your global npm install, imported</text>
  <text x="52" y="351" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">createAgentSession() · agent loop</text>

  <!-- SdkService -> Pi SDK -->
  <line x1="162" y1="240" x2="162" y2="276" stroke="#f9e2af" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <text x="170" y="262" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="8">dynamic import</text>
  <!-- Bridge Tools -> Pi SDK -->
  <line x1="470" y1="222" x2="336" y2="300" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="415" y="232" text-anchor="middle" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="8">customTools</text>

  <!-- vscode API -->
  <rect x="470" y="276" width="256" height="84" rx="6" fill="#313244" stroke="#45475a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="598" y="298" text-anchor="middle" fill="#cdd6f4" font-family="DejaVu Sans Mono" font-size="11" font-weight="700">vscode.* API</text>
  <text x="598" y="321" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">editor · diagnostics · symbols</text>
  <text x="598" y="337" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">hover · definitions · references</text>
  <text x="598" y="351" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">workspace edits</text>

  <!-- Bridge Tools -> vscode API -->
  <line x1="598" y1="240" x2="598" y2="276" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ====== Bottom: agent home and LLM ====== -->
  <rect x="34" y="404" width="300" height="28" rx="5" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="184" y="422" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">~/.pi/agent · sessions · models.json</text>
  <rect x="410" y="404" width="300" height="28" rx="5" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="560" y="422" text-anchor="middle" fill="#a6adc8" font-family="DejaVu Sans Mono" font-size="9">LLM providers (HTTPS · streaming)</text>

  <!-- Pi SDK -> agent home -->
  <line x1="110" y1="360" x2="110" y2="404" stroke="#f9e2af" stroke-width="1.8" marker-end="url(#arrowYellow)"/>
  <text x="118" y="386" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="8">read / write, shared with the pi CLI</text>
  <!-- Pi SDK -> LLM -->
  <line x1="300" y1="360" x2="430" y2="404" stroke="#f9e2af" stroke-width="1.8" marker-end="url(#arrowYellow)"/>

  <text x="380" y="458" text-anchor="middle" fill="#6c7086" font-family="DejaVu Sans Mono" font-size="8">Pi is not a subprocess or a server: the SDK runs inside the extension host</text>
</svg>
